name: Code Linting

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install ESLint globally
        run: npm install -g eslint@8

      - name: Run ESLint
        run: ESLINT_USE_FLAT_CONFIG=false eslint "**/src/**/*.js"
